[package]
name = "netcontrol-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
ssh2 = { version = "0.9", optional = true }

[features]
default = []
real-ssh = ["dep:ssh2"]
